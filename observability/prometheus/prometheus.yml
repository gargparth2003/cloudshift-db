global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloudshift-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: [control-plane:8000]

  - job_name: cloudshift-commerce
    metrics_path: /metrics
    static_configs:
      - targets: [commerce-demo:8001]

  - job_name: cloudshift-workload
    metrics_path: /metrics
    static_configs:
      - targets: [workload-generator:8002]
