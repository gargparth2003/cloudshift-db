name: cloudshift-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudshift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: apps/console/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: apps/console
      - run: npm audit --audit-level=moderate
        working-directory: apps/console
      - run: npm run typecheck
        working-directory: apps/console
      - run: npm run build
        working-directory: apps/console
      - run: npm run build:public
        working-directory: apps/console
      - name: Verify public demo without backend APIs
        run: npm run test:public
        working-directory: apps/console

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: 3.12.8, cache: pip, cache-dependency-path: services/control-plane/requirements.txt }
      - run: pip install -r services/control-plane/requirements.txt
      - run: python -m compileall -q services/control-plane/app scripts
      - run: python -m pytest -q services/control-plane/tests

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --project-name cloudshift-parth --profile core config --quiet
      - run: docker compose --project-name cloudshift-parth --profile core up -d --build --wait
      - run: ./tests/integration/verify-foundation.sh
      - run: docker compose --project-name cloudshift-parth --profile core exec -T control-plane python -m pytest -q
      - if: always()
        run: docker compose --project-name cloudshift-parth --profile core down --volumes

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.17.2 }
      - run: terraform -chdir=infrastructure/terraform/aws init -backend=false -input=false
      - run: terraform -chdir=infrastructure/terraform/aws fmt -check
      - run: terraform -chdir=infrastructure/terraform/aws validate
      - uses: azure/setup-kubectl@v4
        with: { version: v1.37.3 }
      - run: kubectl kustomize infrastructure/kubernetes/base > /tmp/cloudshift-kubernetes.yaml
      - run: test -s /tmp/cloudshift-kubernetes.yaml

  browser:
    runs-on: ubuntu-latest
    needs: [frontend, compose-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: apps/console/package-lock.json }
      - run: cp .env.example .env
      - run: docker compose --project-name cloudshift-parth --profile core up -d --build --wait
      - run: npm ci --ignore-scripts
        working-directory: apps/console
      - name: Test live local topology against the Compose stack
        run: npm run test:browser
        working-directory: apps/console
      - if: always()
        run: docker compose --project-name cloudshift-parth --profile core down --volumes

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
