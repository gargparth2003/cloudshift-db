name: deploy-static-replay

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: npm, cache-dependency-path: apps/console/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: apps/console
      - run: npm run build:public
        working-directory: apps/console
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/console/dist-public }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy only after an authorized manual workflow dispatch
        id: deployment
        uses: actions/deploy-pages@v4
