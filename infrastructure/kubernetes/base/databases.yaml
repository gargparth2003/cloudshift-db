apiVersion: v1
kind: Service
metadata:
  name: source-db
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: source-db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: Service
metadata:
  name: target-db
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: target-db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: v1
kind: Service
metadata:
  name: control-db
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: control-db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: source-db
spec:
  serviceName: source-db
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: source-db } }
  template:
    metadata: { labels: { app.kubernetes.io/name: source-db, cloudshift.io/database-role: source } }
    spec:
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          args: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10, -c, shared_buffers=192MB]
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: cloudshift_admin }
            - { name: POSTGRES_DB, value: parth_commerce_source }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cloudshift-database-secrets, key: source-admin-password } }
          readinessProbe: &pg-ready { exec: { command: [sh, -c, "pg_isready -U cloudshift_admin -d $POSTGRES_DB"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: *pg-ready
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: "1500m", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: target-db
spec:
  serviceName: target-db
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: target-db } }
  template:
    metadata: { labels: { app.kubernetes.io/name: target-db, cloudshift.io/database-role: target } }
    spec:
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          args: [postgres, -c, shared_buffers=192MB]
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: cloudshift_admin }
            - { name: POSTGRES_DB, value: parth_commerce_target }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cloudshift-database-secrets, key: target-admin-password } }
          readinessProbe: { exec: { command: [sh, -c, "pg_isready -U cloudshift_admin -d $POSTGRES_DB"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { exec: { command: [sh, -c, "pg_isready -U cloudshift_admin -d $POSTGRES_DB"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { cpu: "1500m", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: control-db
spec:
  serviceName: control-db
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: control-db } }
  template:
    metadata: { labels: { app.kubernetes.io/name: control-db, cloudshift.io/database-role: control } }
    spec:
      securityContext: { fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          args: [postgres, -c, shared_buffers=128MB]
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: cloudshift_admin }
            - { name: POSTGRES_DB, value: cloudshift_control }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cloudshift-database-secrets, key: control-admin-password } }
          readinessProbe: { exec: { command: [sh, -c, "pg_isready -U cloudshift_admin -d $POSTGRES_DB"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { exec: { command: [sh, -c, "pg_isready -U cloudshift_admin -d $POSTGRES_DB"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: "1000m", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
