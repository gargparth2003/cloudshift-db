apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudshift-config
data:
  DEPLOYMENT_MODE: KUBERNETES
  LOG_LEVEL: INFO
  COMMERCE_BASE_URL: http://commerce-demo:8001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudshift-database-bootstrap-notice
data:
  README: >-
    Deployment preparation only. Build the PostgreSQL init SQL and role scripts from database/*/init
    into reviewed ConfigMaps or a pinned internal database image before applying. This repository does
    not embed credentials or claim a Kubernetes database deployment.
