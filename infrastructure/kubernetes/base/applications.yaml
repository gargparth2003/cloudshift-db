apiVersion: v1
kind: Service
metadata: { name: control-plane }
spec:
  selector: { app.kubernetes.io/name: control-plane }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: commerce-demo }
spec:
  selector: { app.kubernetes.io/name: commerce-demo }
  ports: [{ name: http, port: 8001, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: console }
spec:
  selector: { app.kubernetes.io/name: console }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: control-plane }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: control-plane } }
  template:
    metadata: { labels: { app.kubernetes.io/name: control-plane } }
    spec:
      serviceAccountName: default
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: control-plane
          image: ghcr.io/parthgarg/cloudshift-control-plane:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: cloudshift-config } }, { secretRef: { name: cloudshift-application-secrets } }]
          readinessProbe: { httpGet: { path: /api/v1/health/live, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/v1/health/live, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1000m", memory: 384Mi } }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: commerce-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: commerce-demo } }
  template:
    metadata: { labels: { app.kubernetes.io/name: commerce-demo } }
    spec:
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: commerce-demo
          image: ghcr.io/parthgarg/cloudshift-control-plane:0.1.0
          command: [uvicorn, app.commerce:app, --host, 0.0.0.0, --port, "8001"]
          ports: [{ name: http, containerPort: 8001 }]
          envFrom: [{ configMapRef: { name: cloudshift-config } }, { secretRef: { name: cloudshift-application-secrets } }]
          readinessProbe: { httpGet: { path: /api/v1/commerce/health, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/v1/commerce/health, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 750m, memory: 256Mi } }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: console }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: console } }
  template:
    metadata: { labels: { app.kubernetes.io/name: console } }
    spec:
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: console
          image: ghcr.io/parthgarg/cloudshift-console:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
